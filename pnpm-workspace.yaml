# Supply-chain hardening for pnpm. See https://pnpm.io/settings
minimumReleaseAge: 10080 # wait 7 days before installing a newly published version
blockExoticSubdeps: true # reject transitive git:/file:/tarball deps that skip the registry
trustPolicy: no-downgrade # reject packages whose provenance/signatures weaken between updates
# Expo SDK 54 requires this exact Worklets release, which predates its
# provenance-enabled releases. Keep the reviewed exception pinned to it.
trustPolicyExclude:
  - react-native-worklets@0.5.1
  - semver@6.3.1

# Remove these acknowledgements when GitHub's advisory range recognizes the
# reviewed backports or Expo's Metro dependency ships a patched image-size.
# CI lockfile assertions keep each accepted package version exact.
auditConfig:
  ignoreCves:
    - CVE-2026-14257
    - CVE-2025-71329
    - CVE-2025-71330
